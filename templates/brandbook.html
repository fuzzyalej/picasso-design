<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Brand Board</title>
  <style>
    @import "tokens.css";
    body { margin: 0; font-family: var(--font-sans); color: var(--color-text);
           background: var(--color-bg); line-height: var(--line-body); }
    .wrap { max-width: var(--size-content); margin: 0 auto; padding: var(--space-16) var(--space-6); }
    .essence { font-size: var(--font-size-xl); max-width: var(--size-prose);
               line-height: var(--line-tight); letter-spacing: var(--tracking-tight); }
    h2 { font-size: var(--font-size-lg); margin-top: var(--space-12); }
    .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--space-4); }
    .card { border: 1px solid var(--color-border); border-radius: var(--radius-lg);
            padding: var(--space-6); background: var(--color-surface); }
    .chips { display: flex; gap: var(--space-2); flex-wrap: wrap; }
    .chip { height: 40px; width: 40px; border-radius: var(--radius-md);
            border: 1px solid var(--color-border); }
  </style>
</head>
<body>
  <div class="wrap">
    <p class="essence">Brand essence goes here. One sentence: "[Brand] sounds like [character]: [quality], [quality], [quality]."</p>

    <h2>Values</h2>
    <div class="grid">
      <div class="card">Value one, in one sentence.</div>
      <div class="card">Value two, in one sentence.</div>
      <div class="card">Value three, in one sentence.</div>
    </div>

    <h2>Palette</h2>
    <div class="chips">
      <div class="chip" style="background:var(--color-accent)"></div>
      <div class="chip" style="background:var(--color-text)"></div>
      <div class="chip" style="background:var(--color-surface)"></div>
      <div class="chip" style="background:var(--color-success)"></div>
      <div class="chip" style="background:var(--color-danger)"></div>
    </div>

    <h2>Type</h2>
    <p style="font-size:var(--font-size-2xl)">Aa Display</p>
    <p style="font-size:var(--font-size-md);font-family:var(--font-mono)">Aa Mono</p>
  </div>
</body>
</html>
