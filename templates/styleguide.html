<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Styleguide</title>
  <style>
    @import "tokens.css";
    body { margin: 0; font-family: var(--font-sans); color: var(--color-text);
           background: var(--color-bg); line-height: var(--line-body); }
    .wrap { max-width: var(--size-content); margin: 0 auto; padding: var(--space-12) var(--space-6); }
    h1 { font-size: var(--font-size-2xl); letter-spacing: var(--tracking-tight);
         line-height: var(--line-tight); }
    h2 { font-size: var(--font-size-lg); margin-top: var(--space-12); }
    .swatches { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--space-4); }
    .swatch { border: 1px solid var(--color-border); border-radius: var(--radius-md); overflow: hidden; }
    .swatch .chip { height: 64px; }
    .swatch .label { padding: var(--space-2); font-family: var(--font-mono); font-size: var(--font-size-xs); }
    .ramp { display: flex; gap: var(--space-2); align-items: flex-end; }
    .ramp div { background: var(--color-accent); width: 24px; }
    .btn { font: inherit; padding: var(--space-2) var(--space-4); border-radius: var(--radius-md);
           border: 1px solid transparent; background: var(--color-accent);
           color: var(--color-accent-contrast); min-height: var(--size-tap);
           transition: transform var(--duration-fast) var(--ease-out); cursor: pointer; }
    .btn:hover { filter: brightness(1.05); }
    .btn:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }
    .btn:active { transform: translateY(1px); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn.loading { color: transparent; position: relative; }
    .btn.error { background: var(--color-danger); }
    .btn.success { background: var(--color-success); }
    @media (prefers-reduced-motion: reduce) { .btn { transition-duration: 1ms; } }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Styleguide</h1>
    <p>Rendered live from <code>tokens.css</code>. If a swatch looks wrong, fix the token, not this page.</p>

    <h2>Color</h2>
    <div class="swatches">
      <div class="swatch"><div class="chip" style="background:var(--color-accent)"></div><div class="label">--color-accent</div></div>
      <div class="swatch"><div class="chip" style="background:var(--color-text)"></div><div class="label">--color-text</div></div>
      <div class="swatch"><div class="chip" style="background:var(--color-surface)"></div><div class="label">--color-surface</div></div>
      <div class="swatch"><div class="chip" style="background:var(--color-border)"></div><div class="label">--color-border</div></div>
    </div>

    <h2>Typography</h2>
    <p style="font-size:var(--font-size-2xl)">Display 2xl</p>
    <p style="font-size:var(--font-size-xl)">Heading xl</p>
    <p style="font-size:var(--font-size-md)">Body md, the reading size.</p>
    <p style="font-size:var(--font-size-sm);color:var(--color-text-muted)">Small muted</p>

    <h2>Spacing</h2>
    <div class="ramp">
      <div style="height:var(--space-1)"></div>
      <div style="height:var(--space-2)"></div>
      <div style="height:var(--space-4)"></div>
      <div style="height:var(--space-8)"></div>
      <div style="height:var(--space-16)"></div>
    </div>

    <h2>Buttons: 8 interaction states</h2>
    <p style="display:flex;gap:var(--space-3);flex-wrap:wrap">
      <button class="btn">default</button>
      <button class="btn">hover</button>
      <button class="btn">focus-visible</button>
      <button class="btn">active</button>
      <button class="btn" disabled>disabled</button>
      <button class="btn loading">loading</button>
      <button class="btn error">error</button>
      <button class="btn success">success</button>
    </p>
  </div>
</body>
</html>
